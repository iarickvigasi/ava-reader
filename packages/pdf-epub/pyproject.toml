[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ava-pdf-epub"
version = "0.1.0"
description = "Source-traceable PDF reconstruction and deterministic EPUB worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5", "pypdf==6.19.0", "Pillow==12.3.0", "pdfplumber==0.11.9"]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "mypy==1.20.2", "build==1.3.0", "setuptools==80.9.0"]

[project.scripts]
ava-pdf-epub = "ava_pdf_epub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.package-data]
ava_pdf_epub = ["contracts/schemas/*.json", "py.typed"]
