name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ava-reader
            git pull origin main
            # Pass the freshly-pulled commit to the web build so the service
            # worker cache is versioned by commit (stable + traceable). The
            # build falls back to a timestamp if this is ever unset.
            export GIT_SHA="$(git rev-parse HEAD)"
            docker compose -f compose.yaml -f compose.prod.yaml pull
            docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 https://avacatalog.com/api/health
            curl --fail --silent --show-error --max-time 15 "https://avacatalog.com/api/works?limit=1" > /dev/null
            docker image prune -f
