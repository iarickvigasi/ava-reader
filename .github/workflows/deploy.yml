name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ava-reader
            git pull origin main
            # Pass the freshly-pulled commit to the web build so the service
            # worker cache is versioned by commit (stable + traceable). The
            # build falls back to a timestamp if this is ever unset.
            export GIT_SHA="$(git rev-parse HEAD)"
            docker compose pull
            docker compose up -d --build
            # TEMPORARY (2026-08-19): one-time backfill so users who imported
            # books before the Offline Books shelf shipped get the collection
            # without waiting for their next import. Idempotent (find-or-create
            # by smartKey + createMany skipDuplicates), so re-running on every
            # deploy is harmless — but delete this step once it has run in a
            # green deploy.
            docker compose exec -T api pnpm --filter api db:backfill-offline-books
            docker image prune -f
