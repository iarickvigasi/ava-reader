name: Security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: corepack enable
      - name: Verify source, dependencies and regression tests
        run: sh tools/security/verify-source.sh
      - name: Resolve proxy module graph
        run: |
          docker run --rm -v "$PWD/tools/security/caddy:/src" -v "$PWD/security-reports:/reports" -w /src \
            -e GOTOOLCHAIN=local \
            golang:1.27.3-alpine@sha256:d200d2dd76b03a99b52651fd1325aff7dcd35422c35c01bac56571b0507f3deb \
            sh -c 'apk add --no-cache patch && go mod tidy && sh prepare-jose.sh && go test -p 2 -mod=vendor github.com/go-jose/go-jose/v3/... > /reports/caddy-jose-tests.txt && touch /reports/caddy-jose.verified && CGO_ENABLED=0 go list -mod=vendor -deps . > /reports/caddy-packages.txt'
      - name: Build hardened images
        run: sh tools/security/build-images.sh
      - name: Verify migrations, runtime restrictions and proxy logging
        run: sh tools/security/smoke-images.sh
      - name: Scan image packages
        run: sh tools/security/scan-images.sh
      - name: Check committed proxy dependency graph
        run: git diff --exit-code -- tools/security/caddy/go.mod tools/security/caddy/go.sum
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-evidence
          path: |
            security-reports/
            tools/security/caddy/go.mod
            tools/security/caddy/go.sum
