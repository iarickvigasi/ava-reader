services:
  api:
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # dev-server.sh = migrate deploy → prisma generate → nest --watch, plus schema.prisma
    # watching (regenerate client + restart Nest on change) — see docs/dev.md.
    command: ["sh", "/app/apps/api/scripts/dev-server.sh"]
    volumes:
      - ./apps/api:/app/apps/api
