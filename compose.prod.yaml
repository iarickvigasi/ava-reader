# Production catalog routing; layer on top of compose.yaml.
services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${AVA_POSTGRES_PASSWORD:?Set AVA_POSTGRES_PASSWORD on the server}

  api:
    # Production migrations run explicitly in the deployment workflow before service startup.
    build:
      target: runtime
    command: ["node", "dist/main.js"]
    environment:
      READING_ASSET_SYNC_SECRET: ${READING_ASSET_SYNC_SECRET:?Set READING_ASSET_SYNC_SECRET on the server}
      CATALOG_API_BASE_URL: http://catalog:4001
      DATABASE_URL: postgresql://postgres:${AVA_POSTGRES_PASSWORD:?Set AVA_POSTGRES_PASSWORD on the server}@postgres:5432/ava_reader?schema=public

  catalog-postgres:
    # Allow more filesystem cache under importer I/O pressure; shared_buffers stays 128MB.
    mem_limit: 1g
    volumes: !override
      - type: bind
        source: /mnt/HC_Volume_107260972/ava-catalog/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  catalog-importer:
    build:
      target: runtime
    image: ava-reader-catalog:latest
    mem_limit: 1g
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    volumes: !override
      - type: bind
        source: /mnt/HC_Volume_107260972/ava-catalog/imports
        target: /imports
        read_only: true
        bind:
          create_host_path: false

  catalog:
    # Buffer headroom for public EPUB and reader-package transfers.
    mem_limit: 1g
    build:
      target: runtime
    command: ["node", "dist/src/main.js"]
    environment:
      CATALOG_WEB_ORIGIN: https://avareader.space
      READING_ASSET_SYNC_SECRET: ${READING_ASSET_SYNC_SECRET:?Set READING_ASSET_SYNC_SECRET on the server}
  web:
    build:
      args:
        NEXT_PUBLIC_CATALOG_API_BASE_URL: /catalog
    environment:
      NEXT_PUBLIC_CATALOG_API_BASE_URL: /catalog

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      catalog:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
