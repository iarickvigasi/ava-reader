# Production-only hardening; include after compose.prod.yaml.
x-log-policy: &logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-app-security: &app-security
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  logging: *logs

x-postgres-build: &postgres-build
  context: .
  dockerfile: tools/security/postgres.Dockerfile
  target: runtime

services:
  postgres:
    image: ${AVA_IMAGE_PREFIX:-ava-reader}-postgres:latest
    build: *postgres-build
    security_opt: [no-new-privileges:true]
    logging: *logs
  catalog-postgres:
    image: ${AVA_IMAGE_PREFIX:-ava-reader}-postgres:latest
    build: *postgres-build
    security_opt: [no-new-privileges:true]
    logging: *logs
  api:
    <<: *app-security
    ports: !override ["127.0.0.1:${API_HOST_PORT:-4000}:4000"]
  catalog:
    <<: *app-security
    ports: !override ["127.0.0.1:${CATALOG_HOST_PORT:-4001}:4001"]
  web:
    <<: *app-security
    ports: !override ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0755
  caddy:
    image: ${AVA_IMAGE_PREFIX:-ava-reader}-caddy:latest
    build:
      context: .
      dockerfile: tools/security/caddy.Dockerfile
    <<: *app-security
    # Permit HTTP(S) low-port binding while dropping every other capability.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    volumes:
      - /var/log/caddy:/var/log/caddy
